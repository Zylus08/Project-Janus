[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-janus"
version = "0.1.0"
description = "Chess-first research engine with custom search and future learned evaluation"
requires-python = ">=3.10"
dependencies = ["python-chess>=1.999"]

[tool.setuptools.packages.find]
where = ["src"]
